{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview - CareerNova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/interview.css' %}">
</head>
<body>

<nav class="career-navbar">
    <div class="logo">Career<span>Nova</span></div>
    <a href="{% url 'home' %}" class="btn btn-warning fw-semibold">Exit Interview</a>
</nav>

<main class="interview-container">
    <div class="interview-card">

        <div class="question-header">
            <span>Question {{ question_number }} of {{ total_questions }}</span>
            <span class="question-type">{{ question.type }}</span>
        </div>

        <div class="question-content">
            <h2>{{ question.question }}</h2>
        </div>

        <form method="POST" action="{% url 'submit_answer' %}">
            {% csrf_token %}

            <div class="mb-4">
                <label for="answer" class="form-label">Your Answer</label>
                <textarea id="answer" name="answer" class="form-control answer-box" placeholder="Type your answer here..." required></textarea>
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-warning interview-btn">Submit Answer</button>
            </div>
        </form>

    </div>
</main>

</body>
</html>
